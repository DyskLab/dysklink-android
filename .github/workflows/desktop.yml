# Builds DyskLink for Windows and Linux. jpackage can only make an installer on its own system,
# so each one is built on its own runner. A tag such as desktop-v1.0.0 builds the installers as artifacts;
# they are published by hand to DyskLab/dysklink-desktop, which the desktop app checks for updates.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["core/**", "desktop/**", ".github/workflows/desktop.yml", "*.gradle.kts", "gradle/**"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["core/**", "desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DYSKLINK_DESKTOP_ONLY: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :desktop:test --console=plain

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: packageMsi packageExe
          - os: ubuntu-latest
            tasks: packageDeb packageRpm createDistributable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # DyskLink Camera, the webcam on Windows: softcam (github.com/tshino/softcam, MIT), a DirectShow camera filter,
      # pinned to v1.8.1 and built with its own name, class id and shared memory, so video apps list "DyskLink Camera"
      # and it lives beside any other softcam ("DirectShow Softcam"). The class id must match Softcam.CLSID in the app.
      # The C runtime is linked in, so the DLL needs no Visual C++ redistributable. It ships in the MSI/EXE resources.
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - name: DyskLink Camera (softcam)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOFTCAM_COMMIT: afb424c2415b04da627fa1a7b4706575c2ba3010
        run: |
          $src = Join-Path $env:RUNNER_TEMP "softcam"
          git clone --quiet https://github.com/tshino/softcam.git $src
          git -C $src checkout --quiet $env:SOFTCAM_COMMIT
          function Patch($file, $from, $to) {
            $path = Join-Path $src $file
            $text = Get-Content $path -Raw
            if (-not $text.Contains($from)) { throw "softcam changed: '$from' is not in $file" }
            Set-Content $path $text.Replace($from, $to) -NoNewline
          }
          Patch "src\softcam\softcam.cpp" 'L"DirectShow Softcam"' 'L"DyskLink Camera"'
          Patch "src\softcam\softcam.cpp" '0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e' '0xab6332aa, 0x0874, 0x412f, 0x80, 0x0f, 0xc0, 0xa4, 0x72, 0xf4, 0xb5, 0x54'
          Patch "src\softcamcore\FrameBuffer.cpp" '"DirectShow Softcam/NamedMutex"' '"DyskLink Camera/NamedMutex"'
          Patch "src\softcamcore\FrameBuffer.cpp" '"DirectShow Softcam/SharedMemory"' '"DyskLink Camera/SharedMemory"'
          $props = Join-Path $env:RUNNER_TEMP "static-crt.props"
          Set-Content $props '<Project><ItemDefinitionGroup><ClCompile><RuntimeLibrary>MultiThreaded</RuntimeLibrary></ClCompile></ItemDefinitionGroup></Project>'
          msbuild (Join-Path $src "softcam.sln") /m /t:softcam /p:Configuration=Release /p:Platform=x64 "/p:ForceImportBeforeCppTargets=$props"
          if ($LASTEXITCODE -ne 0) { throw "softcam build failed" }
          $out = Join-Path $env:GITHUB_WORKSPACE "desktop\resources\windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $src "dist\bin\x64\softcam.dll") $out
          Copy-Item (Join-Path $src "LICENSE") (Join-Path $out "softcam-LICENSE.txt")
          Get-Item (Join-Path $out "softcam.dll")
      # Second display on Windows: the Virtual Display Driver (github.com/VirtualDrivers/Virtual-Display-Driver, MIT),
      # an IddCx monitor driver, release 25.7.23 (its "x86" driver-only zip holds the x64 build), installed by the app
      # with nefcon (github.com/nefarius/nefcon, MIT) v1.14.0's nefconw.exe. Both pinned by SHA-256; the app looks for
      # resources/vdd/nefconw.exe and resources/vdd/VirtualDisplayDriver/MttVDD.inf (Vdd.bundled).
      - name: Virtual Display Driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "vdd"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          function Fetch($url, $sha, $name) {
            $file = Join-Path $tmp $name
            Invoke-WebRequest -Uri $url -OutFile $file
            $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "$name has SHA-256 $got, expected $sha" }
            $file
          }
          $driver = Fetch "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip" `
            "e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a" "driver.zip"
          $nefcon = Fetch "https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip" `
            "a15557da24a9efca203158de3b43b0eaf982db231f0194031f1ed428bc13e669" "nefcon.zip"
          Expand-Archive $driver (Join-Path $tmp "driver")
          Expand-Archive $nefcon (Join-Path $tmp "nefcon")
          $out = Join-Path $env:GITHUB_WORKSPACE "desktop\resources\windows-x64\vdd"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse (Join-Path $tmp "driver\VirtualDisplayDriver") $out
          Copy-Item (Join-Path $tmp "nefcon\x64\nefconw.exe") $out
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/VirtualDrivers/Virtual-Display-Driver/25.7.23/LICENSE" -OutFile (Join-Path $out "VirtualDisplayDriver-LICENSE.txt")
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nefarius/nefcon/v1.14.0/LICENSE" -OutFile (Join-Path $out "nefcon-LICENSE.txt")
          foreach ($f in "nefconw.exe", "VirtualDisplayDriver\MttVDD.inf", "VirtualDisplayDriver\MttVDD.dll", "VirtualDisplayDriver\mttvdd.cat") {
            if (-not (Test-Path (Join-Path $out $f))) { throw "vdd\$f is missing" }
          }
          Get-ChildItem -Recurse $out
      - name: Package
        shell: bash
        run: ./gradlew $(for t in ${{ matrix.tasks }}; do printf ":desktop:%s " "$t"; done) --console=plain
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} out/ \;
          for f in out/*.msi; do [ -e "$f" ] && mv "$f" "out/DyskLink-windows-x64.msi"; done
          for f in out/*.exe; do [ -e "$f" ] && mv "$f" "out/DyskLink-windows-x64-setup.exe"; done
          for f in out/*.deb; do [ -e "$f" ] && mv "$f" "out/DyskLink-linux-amd64.deb"; done
          for f in out/*.rpm; do [ -e "$f" ] && mv "$f" "out/DyskLink-linux-x86_64.rpm"; done
          if [ -d desktop/build/compose/binaries/main/app/DyskLink ]; then
            tar -czf out/DyskLink-linux-x64.tar.gz -C desktop/build/compose/binaries/main/app DyskLink
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: dysklink-${{ runner.os }}
          path: out/*

# Builds DyskLink for Windows and Linux. jpackage can only make an installer on its own system,
# so each one is built on its own runner. A tag such as desktop-v1.0.0 also publishes a release.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["core/**", "desktop/**", ".github/workflows/desktop.yml", "*.gradle.kts", "gradle/**"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["core/**", "desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DYSKLINK_DESKTOP_ONLY: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :desktop:test --console=plain

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: packageMsi packageExe
          - os: ubuntu-latest
            tasks: packageDeb packageAppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        shell: bash
        run: ./gradlew $(for t in ${{ matrix.tasks }}; do printf ":desktop:%s " "$t"; done) --console=plain
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" \) -exec cp {} out/ \;
          for f in out/*.msi; do [ -e "$f" ] && mv "$f" "out/DyskLink-windows-x64.msi"; done
          for f in out/*.exe; do [ -e "$f" ] && mv "$f" "out/DyskLink-windows-x64-setup.exe"; done
          for f in out/*.deb; do [ -e "$f" ] && mv "$f" "out/DyskLink-linux-amd64.deb"; done
          if [ -d desktop/build/compose/binaries/main/app/DyskLink ]; then
            tar -czf out/DyskLink-linux-x64.tar.gz -C desktop/build/compose/binaries/main/app DyskLink
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: dysklink-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" out/* -R "$GITHUB_REPOSITORY" --prerelease \
            --title "DyskLink for Windows and Linux $version" \
            --notes "The first DyskLink for Windows and Linux. See the README for what it does and how to install it."
